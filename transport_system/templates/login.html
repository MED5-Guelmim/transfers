<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تسجيل الدخول — نظام إدارة النقل اللوجستي">
    <title>تسجيل الدخول — نظام النقل اللوجستي</title>

    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #c2185b;
            --primary-light: #e91e63;
            --primary-lighter: #f06292;
            --primary-dark: #880e4f;
            --accent: #f8bbd0;
            --accent-dark: #f48fb1;
            --accent-light: #fce4ec;
            --bg-dark: #1a0a10;
            --bg-card: #1e0f16;
            --text-primary: #f5e6ec;
            --text-secondary: #c9a5b5;
            --text-muted: #8e6578;
            --border-color: #3a1a28;
            --border-light: #4d2535;
            --danger: #ff1744;
            --success: #00c853;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-sm: 8px;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            direction: rtl;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ── خلفية متحركة ── */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(194, 24, 91, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(248, 187, 208, 0.08) 0%, transparent 40%),
                radial-gradient(ellipse at 60% 80%, rgba(194, 24, 91, 0.12) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── كرات خلفية متحركة ── */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }
        .bg-orb-1 {
            width: 400px; height: 400px;
            background: rgba(194, 24, 91, 0.15);
            top: -100px; right: -100px;
            animation: orbFloat1 8s ease-in-out infinite;
        }
        .bg-orb-2 {
            width: 300px; height: 300px;
            background: rgba(233, 30, 99, 0.1);
            bottom: -80px; left: -80px;
            animation: orbFloat2 10s ease-in-out infinite;
        }
        .bg-orb-3 {
            width: 200px; height: 200px;
            background: rgba(248, 187, 208, 0.08);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: orbFloat3 12s ease-in-out infinite;
        }

        @keyframes orbFloat1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-40px, 40px); }
        }
        @keyframes orbFloat2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }
        @keyframes orbFloat3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.3); }
        }

        /* ── تحريكات ── */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 15px rgba(233, 30, 99, 0.3); }
            50% { box-shadow: 0 0 35px rgba(233, 30, 99, 0.6); }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ── بطاقة تسجيل الدخول ── */
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            animation: fadeInUp 0.8s ease-out;
        }

        .login-card {
            background: rgba(30, 15, 22, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 48px 40px 40px;
            box-shadow:
                0 8px 40px rgba(0, 0, 0, 0.4),
                0 0 80px rgba(194, 24, 91, 0.08),
                inset 0 1px 0 rgba(248, 187, 208, 0.05);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary-light), var(--primary-lighter), transparent);
        }

        /* ── أيقونة العلامة التجارية ── */
        .login-brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 36px;
            color: white;
            animation: bounceIn 0.8s ease-out, glow 3s ease-in-out infinite;
            box-shadow: 0 4px 20px rgba(233, 30, 99, 0.4);
        }

        .login-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .login-subtitle {
            font-size: 13px;
            color: var(--accent-dark);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* ── رسائل الخطأ / النجاح ── */
        .flash-message {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeInUp 0.4s ease-out;
        }
        .flash-error {
            background: rgba(255, 23, 68, 0.12);
            border: 1px solid rgba(255, 23, 68, 0.3);
            color: #ff6e86;
        }
        .flash-success {
            background: rgba(0, 200, 83, 0.12);
            border: 1px solid rgba(0, 200, 83, 0.3);
            color: #69f0ae;
        }
        .flash-warning {
            background: rgba(255, 193, 7, 0.12);
            border: 1px solid rgba(255, 193, 7, 0.3);
            color: #ffca28;
        }

        .shake-anim { animation: shake 0.5s ease-in-out; }

        /* ── حقول الإدخال ── */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
            transition: color 0.3s;
            z-index: 1;
        }

        .input-wrapper input {
            width: 100%;
            background: rgba(26, 10, 16, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius);
            padding: 14px 48px 14px 16px;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .input-wrapper input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.15);
            background: rgba(26, 10, 16, 1);
        }

        .input-wrapper input:focus + i,
        .input-wrapper input:focus ~ i {
            color: var(--primary-lighter);
        }

        .toggle-password {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 18px;
            transition: color 0.3s;
            padding: 0;
            z-index: 1;
        }

        .toggle-password:hover { color: var(--accent-dark); }

        /* ── زر تسجيل الدخول ── */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: white;
            border: none;
            border-radius: var(--radius);
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 16px rgba(233, 30, 99, 0.35);
            position: relative;
            overflow: hidden;
            margin-top: 8px;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.6s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(233, 30, 99, 0.5);
            background: linear-gradient(135deg, var(--primary-lighter), var(--primary-light));
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .login-btn .btn-text { transition: opacity 0.3s; }
        .login-btn .btn-loader {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .login-btn.loading .btn-text { display: none; }
        .login-btn.loading .btn-loader { display: flex; }

        .spinner-sm {
            width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        /* ── التذييل ── */
        .login-footer {
            text-align: center;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .login-footer-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: linear-gradient(135deg, rgba(233, 30, 99, 0.1), rgba(233, 30, 99, 0.05));
            border-radius: var(--radius-sm);
            border: 1px solid rgba(233, 30, 99, 0.2);
            color: var(--accent-dark);
            font-size: 12px;
            font-weight: 600;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .login-card { padding: 36px 24px 32px; }
            .login-icon { width: 64px; height: 64px; font-size: 28px; }
            .login-title { font-size: 20px; }
        }

        /* ── scrollbar ── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
        ::selection { background: rgba(233, 30, 99, 0.3); color: white; }
    </style>
</head>
<body>
    <!-- كرات الخلفية -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <div class="login-container">
        <div class="login-card" id="loginCard">
            <!-- العلامة التجارية -->
            <div class="login-brand">
                <div class="login-icon">
                    <i class="bi bi-trophy-fill"></i>
                </div>
                <h1 class="login-title">نظام النقل اللوجستي</h1>
                <p class="login-subtitle">البطولة الوطنية لكرة السلة بكلميم</p>
            </div>

            <!-- رسائل Flash -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash-message flash-{{ category }}" id="flashMsg">
                            <i class="bi {% if category == 'error' %}bi-exclamation-circle-fill{% elif category == 'success' %}bi-check-circle-fill{% else %}bi-info-circle-fill{% endif %}"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- نموذج تسجيل الدخول -->
            <form method="POST" action="{{ url_for('auth.login') }}" id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="username">
                        <i class="bi bi-person-fill" style="margin-left: 4px;"></i>
                        اسم المستخدم
                    </label>
                    <div class="input-wrapper">
                        <input type="text"
                               id="username"
                               name="username"
                               placeholder="أدخل اسم المستخدم"
                               required
                               autofocus
                               autocomplete="username">
                        <i class="bi bi-person"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="bi bi-lock-fill" style="margin-left: 4px;"></i>
                        كلمة المرور
                    </label>
                    <div class="input-wrapper">
                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="أدخل كلمة المرور"
                               required
                               autocomplete="current-password">
                        <i class="bi bi-lock"></i>
                        <button type="button" class="toggle-password" id="togglePassword" tabindex="-1">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-text">
                        <i class="bi bi-box-arrow-in-left" style="margin-left: 8px;"></i>
                        تسجيل الدخول
                    </span>
                    <span class="btn-loader">
                        <div class="spinner-sm"></div>
                        جاري الدخول...
                    </span>
                </button>
            </form>

            <!-- التذييل -->
            <div class="login-footer">
                <div class="login-footer-badge">
                    <i class="bi bi-basketball"></i>
                    <span>كرة السلة بكلميم 2026</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // إظهار/إخفاء كلمة المرور
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passInput = document.getElementById('password');
            const icon = this.querySelector('i');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                passInput.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });

        // تأثير التحميل عند الإرسال
        document.getElementById('loginForm').addEventListener('submit', function() {
            const btn = document.getElementById('loginBtn');
            btn.classList.add('loading');
            btn.disabled = true;
        });

        // هز البطاقة عند وجود خطأ
        const flashMsg = document.getElementById('flashMsg');
        if (flashMsg && flashMsg.classList.contains('flash-error')) {
            document.getElementById('loginCard').classList.add('shake-anim');
            setTimeout(() => {
                document.getElementById('loginCard').classList.remove('shake-anim');
            }, 600);
        }
    </script>
</body>
</html>
